# ======================
# BasicBERT - Base Config
# ======================

model:
  vocab_size: 30000
  d_model: 512
  num_heads: 8
  num_layers: 6
  d_ff: 2048
  max_len: 512
  dropout: 0.1
  num_classes: 2

training:
  batch_size: 16
  learning_rate: 5e-5
  weight_decay: 0.01
  epochs: 3
  max_steps: null
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  seed: 42

data:
  max_length: 128
  mlm_probability: 0.15

optimizer:
  name: "AdamW"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: "linear"
  warmup_steps: 1000

logging:
  log_every: 50
  eval_every: 500
  save_every: 1000

paths:
  output_dir: "checkpoints"
  log_dir: "logs"
  tokenizer_path: "data/processed/tokenizer.json"